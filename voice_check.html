<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>声の確認</title>
<style>
  :root { --bg: #14161a; --panel: #1e2127; --line: #2f343d; --text: #e8eaed; --sub: #9aa3af; --accent: #4f9cf9; --ok: #4cc38a; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  p, li { color: var(--sub); font-size: 0.95rem; }
  button { display: block; width: 100%; margin: 10px 0; padding: 14px; font-size: 1.05rem; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  button.primary { background: var(--accent); color: #07121f; border-color: var(--accent); font-weight: 700; }
  pre { white-space: pre-wrap; word-break: break-all; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 0.85rem; color: var(--text); min-height: 6em; }
  .row { display: flex; gap: 10px; } .row button { margin: 10px 0; }
</style>
</head>
<body>
<main>
  <h1>声の確認(英語リスニング練習)</h1>
  <p>iPhone で、声が出ない原因を、調べるための、ページです。<b>上から順に</b>、ボタンを押して、音が出るかを、確かめてください。押すたびに、下の枠に、結果が出ます。枠の内容を、スクリーンショットで、見せてください。このページは、何も、保存も、送信も、しません。</p>
  <ul>
    <li>先に、消音スイッチ(オレンジが見えたら、消音)を、オフにして、音量を、上げておいてください。</li>
    <li>聞こえたかは、ボタンごとに、「聞こえた」「聞こえない」を、メモしてください。</li>
  </ul>
  <button id="t-beep-audio">① ピッ(音声ファイルの音)</button>
  <button id="t-beep-web">② ピッ(Web Audio の音)</button>
  <button id="t-speak-min" class="primary">③ 英語の声(いちばん簡単な出し方)</button>
  <button id="t-speak-voice">④ 英語の声(声を指定して)</button>
  <button id="t-speak-rate">⑤ 英語の声(速さ 0.8 で)</button>
  <button id="t-speak-ja">⑥ 日本語の声(こんにちは)</button>
  <button id="t-silent-now">⑦ 声(無音の音声ファイルを流しながら、すぐ)</button>
  <button id="t-silent-later">⑧ 声(無音の音声ファイルを流して、0.5秒後に)</button>
  <button id="t-silent-stop">⑨ 無音の音声ファイルを、止める</button>
  <div class="row">
    <button id="t-info">状態を、もう一度、表示</button>
    <button id="t-clear">枠を、消す</button>
  </div>
  <pre id="log" aria-live="polite"></pre>
</main>
<script src="voice_check.js"></script>
</body>
</html>
